#
# aria2 configuration baked into the container.
# Follows P3TERX/aria2.conf (https://github.com/P3TERX/aria2.conf), adapted to this image.
#   * paths live under /config (state) and /downloads (data), owned by uid/gid 1000
#   * static values only, no environment-variable substitution and no entrypoint
#   * no BT tracker list is fetched at runtime (NO RUNTIME PULLING)
#   * the on-download helper scripts (clean.sh/delete.sh) are not bundled, so their hooks are commented out
#   * a 本仓库 note marks options implemented only on this fork (master-own)
# 每行注释末尾的「默认」是上游 aria2 的原生默认值，删掉该行即回退到它。
# Customise by bind-mounting your own file to /config/aria2.conf, or by passing flags on the command line (CLI wins), e.g. docker run ... fs088/aria2:latest-own --rpc-secret=yourtoken

## 文件保存设置 / File saving ##

# 下载目录，可用绝对或相对路径。默认：当前启动位置
dir=/downloads

# 磁盘缓存，0 为禁用，先把数据在内存聚合再集中写盘以降低 I/O、保护硬盘。默认：16M
disk-cache=64M

# 文件预分配方式，可选 none/prealloc/trunc/falloc，机械硬盘(ext4/btrfs/xfs)建议 falloc、固态硬盘建议 none，报 fallocate not supported 时改回 none。默认：prealloc
file-allocation=falloc

# 小于此值的文件不预分配空间，单位 K/M。默认：5M
no-file-allocation-limit=64M

# 断点续传。默认：false
continue=true

# 始终尝试断点续传，无法续传则终止下载。默认：true
always-resume=false

# 不支持续传的 URI 达到此值则从头下载，0 表示全部不支持时才从头下载。默认：0
max-resume-failure-tries=0

# 取服务器文件时间作为本地文件时间。默认：false
remote-time=true


## 进度保存设置 / Session ##

# 从会话文件读取下载任务。默认：不读取
input-file=/config/aria2.session

# 退出或按间隔把未完成/错误任务保存到会话文件。默认：不保存
save-session=/config/aria2.session

# 任务状态改变后保存会话的间隔秒数，0 为仅正常退出时保存。默认：0
save-session-interval=1

# 自动保存下载进度(*.aria2)的间隔秒数，0 为仅正常退出时保存。默认：60
auto-save-interval=20

# 强制保存，任务完成后仍保留 .aria2 控制文件。默认：false
force-save=false


## 下载连接设置 / Connections ##

# 文件未找到重试次数，需配合 max-tries。默认：0（禁用）
max-file-not-found=10

# 最大尝试次数，0 为无限。默认：5
max-tries=0

# 重试等待时间秒数。默认：0（禁用）
retry-wait=10

# 连接超时秒数。默认：60
connect-timeout=10

# 读/操作超时秒数。默认：60
timeout=10

# 最大同时下载任务数，运行时可改。默认：5
max-concurrent-downloads=5

# 单服务器最大连接线程数，受 split 限制，本仓库已解除上游 16 的硬上限可按需上调。默认：1
max-connection-per-server=16

# 单任务最大连接线程数。默认：5
split=64

# 文件最小分段大小(1M-1024M)，越小分段越多、实际线程越大。默认：20M
min-split-size=4M

# HTTP/FTP 下载分片大小，所有分割须为其倍数。默认：1M
piece-length=1M

# 允许分片大小变化，进度部分丢失也继续而非中止。默认：false
allow-piece-length-change=true

# 最低下载速度限制(HTTP/FTP)，0 为不限，本仓库在低速时重连而非中止任务。默认：0
lowest-speed-limit=0

# 全局最大下载速度限制，0 为不限。默认：0
max-overall-download-limit=0

# 单任务下载速度限制，0 为不限。默认：0
max-download-limit=0

# 禁用 IPv6。默认：false
disable-ipv6=true

# 支持 HTTP gzip/deflate 内容编码。默认：false
http-accept-gzip=true

# URI 复用。默认：true
reuse-uri=true

# 禁用 netrc 支持。默认：false
no-netrc=true

# 允许覆盖，无控制文件时从头下载。默认：false
allow-overwrite=false

# 文件自动重命名，在扩展名前追加 .1..9999。默认：true
auto-file-renaming=false

# 使用 UTF-8 处理 Content-Disposition。默认：false
content-disposition-default-utf8=true

# 最低 TLS 版本，可选 TLSv1.1/1.2/1.3。默认：TLSv1.2
#min-tls-version=TLSv1.2


## 本仓库增强选项 / This fork's enhancements (master-own) ##
# 以下选项由本仓库实现，上游 aria2 并不认识，仅配合本镜像构建有效。

# 跨所有任务对同一服务器的全局连接数上限，0 为不限，此为全局选项单任务覆盖无意义。默认：0（本仓库新增）
max-overall-connection-per-server=2

# 跨所有任务对同一服务器的全局并发下载任务数上限，0 为不限，同为全局选项。默认：0（本仓库新增）
max-overall-concurrent-download-per-server=2

# 对相应 HTTP 状态码重试，需 retry-wait>0（本配置为 10），用于对抗偶发限流/网关抖动；403 多为永久拒绝、重试无益且可能被封 IP 故保持 false。默认：false（本仓库新增）
retry-on-400=true
retry-on-403=false
retry-on-406=true
retry-on-unknown=true

# 是否禁止发送 Want-Digest 请求头，本仓库已反转上游默认即 true 表示不发送，仅当确需摘要校验时设为 false 让其发送（部分站点会据此识别 aria2）。默认：true（上游始终发送）
no-want-digest-header=true

# SOCKS5 代理，--all-proxy 等现支持 socks5:// 与 socks5h:// 两种 scheme 且省略端口默认 1080，前者由 aria2 解析目标名、后者交给代理解析（需代理侧才能看到域名时用后者），FTP 不支持 SOCKS5 而 HTTP/HTTPS/SFTP 可用。默认：不使用代理
all-proxy=socks5h://proxy-host:8110
#all-proxy-user=
#all-proxy-passwd=


## HTTP 行为 / HTTP behavior ##

# 首次请求对 HTTP 服务器使用 HEAD 方法。默认：false
#use-head=true

# 仅在服务器要求时才发送认证头，false 则始终发送。默认：false
#http-auth-challenge=true

# 发送 Cache-Control/Pragma no-cache 头以避免命中缓存。默认：false
#http-no-cache=true

# 仅当本地文件比远程旧时才下载(仅 HTTP(S)，覆盖需 allow-overwrite)。默认：false
#conditional-get=true

# 启用 HTTP/1.1 持久连接。默认：true
#enable-http-keep-alive=false

# 启用 HTTP/1.1 流水线。默认：false
#enable-http-pipelining=true

# 并发建立连接以加快多任务起步。默认：true
#async-connect=false

# 设置 Referer 请求头。默认：空
#referer=

# 追加自定义请求头，可多次指定。默认：无
#header=X-Header: value

# HTTP 认证账号/密码(影响所有 URI)。默认：空
#http-user=
#http-passwd=

# 代理方法，可选 get|tunnel(SOCKS5 恒为 tunnel)。默认：get
#proxy-method=tunnel

# 免代理主机列表，逗号分隔，支持 .domain 与 * 通配。默认：空
#no-proxy=

# 是否校验 HTTPS 服务器证书(仅在无可用 CA 时才建议关闭)。默认：true
#check-certificate=false

# CA 证书/客户端证书/私钥。本构建不烘焙 ca-bundle 路径，默认走 OpenSSL 系统信任库(Alpine 的 /etc/ssl)。默认：系统 CA
#ca-certificate=/config/ca.pem
#certificate=/config/client.pem
#private-key=/config/client.key


## FTP 设置 / FTP ##

# 被动模式传输，false 则用主动模式。默认：true
#ftp-pasv=false

# 传输类型，可选 binary|ascii。默认：binary
#ftp-type=ascii

# 复用 FTP 连接。默认：true
#ftp-reuse-connection=false

# FTP 账号/密码(影响所有 URI)。默认：空
#ftp-user=
#ftp-passwd=

# FTP 专用代理，不可用 SOCKS5。默认：空
#ftp-proxy=
#ftp-proxy-user=
#ftp-proxy-passwd=


## Metalink 设置 / Metalink ##

# 下载 .meta4/.metalink 后自动解析并下载其中文件：true 存盘/false 仅下载/mem 存内存。默认：true
#follow-metalink=mem

# 镜像有多协议时仅用其一，配合 metalink-preferred-protocol。默认：true
#metalink-enable-unique-protocol=false

# 协议偏好，可选 http|https|ftp|ftps。默认：不指定
#metalink-preferred-protocol=https

# 语言/地区/操作系统/版本 偏好。默认：不指定
#metalink-language=zh-CN
#metalink-location=CN
#metalink-os=linux
#metalink-version=

# 本地 metalink 文件中相对 URI 的基准。默认：空
#metalink-base-uri=

# 提供分块校验和时边下载边校验。默认：true
#realtime-chunk-checksum=false


## 校验与内存映射 / Integrity & mmap ##

# 通过分块/整体哈希校验完整性(需种子/metalink/checksum)。默认：false
#check-integrity=true

# 仅做哈希校验后即中止，无论是否下完。默认：false
#hash-check-only=true

# 只探测远程文件可用性而不实际下载(HTTP/FTP)。默认：false
#dry-run=true

# 下载前删除控制文件，配合 allow-overwrite 则始终从头下载。默认：false
#remove-control-file=true

# 整体文件校验值，格式 TYPE=DIGEST。默认：空
#checksum=sha-1=b88ef31e23492859abcac7bb6de274508e9a167c

# 将文件映射进内存(需预分配，配合 file-allocation)。默认：false
#enable-mmap=true

# 启用 mmap 的最大文件大小，0 为不限。默认：0
#max-mmap-limit=0

# HTTP/FTP 分段选择算法，可选 default|inorder|random|geom，边下边播选 geom/inorder。默认：default
#stream-piece-selector=geom

# URI 选择算法，可选 inorder|feedback|adaptive。默认：feedback
#uri-selector=adaptive


## BT/PT 下载设置 / BitTorrent ##

# BT 监听端口(TCP)，NAS 需路由器端口转发并防火墙放行入站。默认：6881-6999
listen-port=51413

# DHT 与 UDP tracker 监听端口(UDP)，可与 BT 端口相同以便防火墙/转发配置。默认：6881-6999
dht-listen-port=51413

# 启用 IPv4 DHT，私有种子自动禁用。默认：true
enable-dht=true

# 启用 IPv6 DHT，无 IPv6 环境开启会异常。默认：false
enable-dht6=false

# BT/DHT 网络中的对外公网 IP，家宽无公网时可指向有公网 IP 的中转服务器。默认：空
#bt-external-ip=

# IPv4 DHT 路由表文件。默认：$HOME/.aria2/dht.dat
dht-file-path=/config/dht.dat

# IPv6 DHT 路由表文件。默认：$HOME/.aria2/dht6.dat
dht-file-path6=/config/dht6.dat

# IPv4 DHT 引导节点。
dht-entry-point=dht.transmissionbt.com:6881

# IPv6 DHT 引导节点。
dht-entry-point6=dht.transmissionbt.com:6881

# 本地节点发现 LPD，私有种子自动禁用。默认：false
bt-enable-lpd=true

# 指定 LPD 使用的接口(接口名/IP)。默认：默认接口
#bt-lpd-interface=

# 启用节点交换 PEX，私有种子自动禁用。默认：true
enable-peer-exchange=true

# BT 单任务最大连接数，运行时可改，0 为不限，连接过多可能因 CPU 瓶颈导致进程被杀或在内网压垮转发性能。默认：55
bt-max-peers=128

# BT 期望速度(单任务)，低于此值临时提高连接数以加速。默认：50K
bt-request-peer-speed-limit=10M

# 全局最大上传速度限制，运行时可改，0 为不限，设过低会影响 BT 下载。默认：0
max-overall-upload-limit=2M

# 单任务上传速度限制，0 为不限。默认：0
max-upload-limit=0

# 最小分享率，达到后停止做种，0 为一直做种。默认：1.0
seed-ratio=3.0

# 最小做种时间分钟数，与分享率两者任一满足即停止做种，72 小时即 4320。默认：（未设）
seed-time=4320

# 做种前校验文件哈希。默认：true
bt-hash-check-seed=true

# 继续之前的 BT 任务时不再校验。默认：false
bt-seed-unverified=false

# BT tracker 连接超时秒数。默认：60
bt-tracker-connect-timeout=10

# BT tracker 超时秒数。默认：60
bt-tracker-timeout=10

# BT tracker 连接间隔秒数，0 为自动。默认：0
#bt-tracker-interval=0

# 优先下载文件头尾以便边下边播。默认：不优先
bt-prioritize-piece=head=32M,tail=32M

# 保存经 RPC 上传的种子文件。默认：true
rpc-save-upload-metadata=true

# 下载种子文件后自动开始下载，true 保存种子/false 仅下载种子/mem 存内存。默认：true
follow-torrent=true

# 下载完种子文件后暂停任务。默认：false
pause-metadata=false

# 保存磁力元数据为种子文件。默认：false
bt-save-metadata=true

# 加载已保存的元数据文件(*.torrent)以避免重复获取。默认：false
bt-load-saved-metadata=true

# 删除 BT 任务中未选择的文件。默认：false
bt-remove-unselected-file=true

# BT 强制加密，等效 bt-require-crypto+bt-min-crypto-level=arc4，可绕过部分运营商干扰。默认：false
bt-force-encryption=true
#bt-require-crypto=true
#bt-min-crypto-level=arc4

# 分离仅做种任务以避免占用并发下载槽位。默认：false
bt-detach-seed-only=true

# 多文件 BT/Metalink 下载全局同时打开的文件数上限，大型媒体库集合可适当上调。默认：100
#bt-max-open-files=1000

# 下载速度连续 N 秒为 0 则停止该 BT 任务，0 为禁用。默认：0
#bt-stop-timeout=60


## 客户端伪装 / Client disguise ##

# 自定义 User Agent，采用当前主流浏览器默认的减缩 UA（主版本号.0.0.0）以避免旧 UA 成为特征。默认：aria2/版本
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36 Edg/138.0.0.0

# BT 客户端伪装，本镜像默认不启用，部分公共种子欢迎伪装客户端但 PT/私有站若 UA 与 peer-agent 不匹配可能封号，按需自行开启且 PT 需二者一致。默认：使用 aria2 内置标识
#peer-agent=Deluge 1.3.15
#peer-id-prefix=-DE13F0-


## 执行额外命令 / Hooks ##
# 依赖 P3TERX 的 clean.sh/delete.sh 脚本，本镜像未内置故保持注释。默认：不执行

#on-download-stop=/config/delete.sh
#on-download-complete=/config/clean.sh
#on-download-error=
#on-download-pause=
#on-download-start=
#on-bt-download-complete=


## RPC 设置 / RPC ##

# 启用 JSON-RPC/XML-RPC 服务。默认：false
enable-rpc=true

# 接受所有 Origin 远程请求。默认：false
rpc-allow-origin-all=true

# 允许外部访问并监听所有网卡。默认：false
rpc-listen-all=true

# RPC 监听端口。默认：6800
rpc-listen-port=6800

# SECURITY: 镜像内置仅为开箱可用，暴露 6800 前务必用挂载配置或命令行 --rpc-secret=... 覆盖。默认：空（无鉴权）
rpc-secret=changeme

# RPC 最大请求大小。默认：10M
rpc-max-request-size=10M

# RPC 认证用户/密码(HTTP Basic)。默认：空
#rpc-user=
#rpc-passwd=

# RPC SSL/TLS，建议用 Nginx/Caddy 反代代替故默认不开启。默认：false
#rpc-secure=false
#rpc-certificate=/config/xxx.pem
#rpc-private-key=/config/xxx.key

# 事件轮询方式，可选 epoll/kqueue/port/poll/select，本构建已启用 epoll 故默认即 epoll。
#event-poll=select


## 高级选项 / Advanced ##

# 启用异步 DNS，构建已启用 c-ares。默认：true
#async-dns=true

# 指定异步 DNS 服务器，未指定则读 /etc/resolv.conf。默认：系统 DNS
#async-dns-server=119.29.29.29,223.5.5.5,8.8.8.8,1.1.1.1

# 指定网络接口(接口名/IP/主机名)，已知会阻断 localhost RPC 通信故谨慎使用。默认：自动
#interface=

# 指定多个网络接口逗号分隔，interface 存在时忽略此项。默认：自动
#multiple-interface=


## 日志设置 / Logging ##
# 容器内默认不写日志文件，交由 Docker 采集 stdout。

# 日志文件保存路径，空为不保存。默认：不保存
#log=/config/aria2.log

# 日志级别，可选 debug/info/notice/warn/error。默认：debug
#log-level=warn

# 控制台日志级别。默认：notice
console-log-level=notice

# 安静模式，禁止控制台日志输出。默认：false
quiet=false

# 下载进度摘要输出间隔秒数，0 为禁止输出。默认：60
summary-interval=0

# 关闭控制台进度条以避免日志中大量空行。默认：true（显示）
show-console-readout=false


## BitTorrent trackers ##
# 不在镜像内拉取 tracker 列表(NO RUNTIME PULLING)，如需自行填入或覆盖配置。默认：空
bt-tracker=
