name: Docker

# Container delivery: build the linux/amd64 image and publish it to Docker Hub.
# Triggered by pushes to the main branch and by manual dispatch (AGENTS.md).
on:
  push:
    branches: [master-own]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BuildKit + containerd are the default on current runners; setup-buildx
      # wires up a builder we can push through.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: fs088/aria2:latest-own
          cache-from: type=gha
          cache-to: type=gha,mode=max
